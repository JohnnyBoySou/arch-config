# ── Vídeo ─────────────────────────────────────
vo=gpu-next
gpu-api=vulkan
hwdec=vaapi                 # decodificação por hardware (RX 7600 / Vega)
profile=high-quality

# ── Janela ────────────────────────────────────
keep-open=yes               # não fecha ao terminar o vídeo
save-position-on-quit=yes   # retoma de onde parou
autofit-larger=90%x90%      # nunca abre maior que a tela
geometry=50%:50%            # centralizada

# ── Áudio ─────────────────────────────────────
volume=80
volume-max=150
audio-file-auto=fuzzy

# ── Legendas ──────────────────────────────────
sub-auto=fuzzy
slang=pt-BR,pt,por,en,eng
alang=pt-BR,pt,por,ja,jpn,en,eng
sub-font-size=42
sub-border-size=2.4
sub-shadow-offset=1

# ── OSD / controles (estilo QuickTime) ────────
osc=yes
osd-bar=no                  # sem barra grande ao mudar volume/posição
osd-font-size=32
osd-duration=1500
cursor-autohide=1000        # esconde o cursor após 1s parado

# ── YouTube e outros streams ──────────────────
ytdl-format=bestvideo[height<=?1440]+bestaudio/best
