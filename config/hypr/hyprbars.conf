# ─────────────────────────────────────────────
#  hyprbars — barra de título estilo macOS
#  Semáforo à esquerda: fechar · minimizar · zoom
# ─────────────────────────────────────────────

plugin = /usr/lib/libhyprbars.so

plugin {
    hyprbars {
        enabled = true

        # Barra: altura e cor (cinza-escuro do macOS Dark)
        bar_height = 28
        bar_color = rgba(2c2c2eaa)
        bar_blur = true
        bar_padding = 13
        bar_button_padding = 8
        bar_precedence_over_border = true
        bar_part_of_window = true

        # Título centrado e discreto
        bar_title_enabled = true
        bar_text_font = SF Pro Display, Inter, Noto Sans, Sans
        bar_text_size = 11
        bar_text_weight = semibold
        bar_text_align = center
        col.text = rgba(ffffffb3)

        # Duplo clique na barra = zoom
        on_double_click = hyprctl dispatch fullscreen 1

        # Semáforo à esquerda; glifos só ao passar o rato,
        # e botões a cinza quando a janela perde o foco — tal como no macOS
        bar_buttons_alignment = left
        icon_on_hover = true
        inactive_button_color = rgba(565658ff)

        # sintaxe: cor_fundo, tamanho, ícone, ação, cor_ícone
        hyprbars-button = rgb(ff5f57), 12, ×, hyprctl dispatch killactive, rgb(6b0a05)
        hyprbars-button = rgb(febc2e), 12, −, /home/sousa/.local/bin/win-minimize, rgb(7c5600)
        hyprbars-button = rgb(28c840), 12, +, hyprctl dispatch fullscreen 1, rgb(0b5d1e)
    }
}

# ── Sem barra dupla nos apps que já desenham a própria ──
windowrule {
    name = hyprbars-nobar-selfdecorated
    match {
        class = ^(firefox|Code|code-oss)$
    }
    hyprbars:no_bar = true
}

windowrule {
    name = hyprbars-nobar-launchers
    match {
        class = ^(vicinae|wofi|nwg-dock-hyprland)$
    }
    hyprbars:no_bar = true
}

windowrule {
    name = hyprbars-nobar-dialogs
    match {
        class = ^(org.kde.polkit-kde-authentication-agent-1|pavucontrol|org.pulseaudio.pavucontrol)$
    }
    hyprbars:no_bar = true
}
