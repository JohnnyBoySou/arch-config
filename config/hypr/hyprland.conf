# ─────────────────────────────────────────────
#  Hyprland — estilo macOS · https://wiki.hypr.land/
# ─────────────────────────────────────────────

################
### MONITORS ###
################

monitor = , preferred, auto, 1

###################
### MY PROGRAMS ###
###################

$terminal    = ghostty
$fileManager = ~/.local/bin/finder
$menu        = /home/sousa/.local/bin/spotlight
$vicinae     = vicinae toggle
$launchpad   = /home/sousa/.local/bin/app-launcher
$browser     = google-chrome-stable

#################
### AUTOSTART ###
#################

exec-once = env LC_TIME=pt_BR.utf8 waybar
exec-once = nwg-dock-hyprland -p bottom -i 44 -x -mb 6 -c /home/sousa/.local/bin/app-launcher -lp start -ico /usr/share/icons/WhiteSur-dark/apps/scalable/view-app-grid.svg -r
exec-once = swaync
exec-once = swayosd-server        # OSD de volume/mute
# Launchpad residente: fica na memória para abrir instantâneo no SUPER
exec-once = nwg-drawer -r -c 8 -is 72 -spacing 28 -wm hyprland -term ghostty -fm dolphin -closebtn none -k -ml 480 -mr 480 -mt 90 -mb 90
exec-once = /home/sousa/.local/bin/drawer-autoclose   # fecha o Launchpad ao sair dele
exec-once = hypridle
exec-once = qs -c controlcenter
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# papel de parede (só arranca se o hyprpaper estiver instalado)
exec-once = sh -c 'command -v hyprpaper >/dev/null && hyprpaper'

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = PATH,/home/sousa/.local/bin:/usr/local/bin:/usr/bin
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,macOS
env = HYPRCURSOR_THEME,macOS
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = GTK_THEME,WhiteSur-Dark

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 8
    border_size = 1
    # macOS: bordas finas e discretas, foco a azul do sistema
    col.active_border = rgba(0a84ffcc)
    col.inactive_border = rgba(ffffff1a)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 12
    # cantos contínuos ("squircle"), como no macOS
    rounding_power = 4.0
    active_opacity = 1.0
    inactive_opacity = 0.97

    shadow {
        enabled = true
        range = 30
        render_power = 3
        offset = 0 8
        color = rgba(00000066)
        color_inactive = rgba(00000033)
    }

    blur {
        enabled = true
        size = 7
        passes = 3
        new_optimizations = true
        xray = false
        noise = 0.015
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.20
        vibrancy_darkness = 0.1
        popups = true
        popups_ignorealpha = 0.2
    }
}

# Vidro fosco nas barras, no Spotlight e nas notificações
layerrule {
    name = glass-waybar
    match {
        namespace = ^(waybar|menubar|dock)$
    }
    blur = true
    # a barra virou ilhas: o fundo dela e transparente e so os tres blocos
    # tem corpo (alpha 0.72). Com 0.1 o vidro pegava a layer inteira e
    # desenhava um retangulo lavado de ponta a ponta.
    ignore_alpha = 0.6
    xray = false
}

layerrule {
    name = blur-dock
    match {
        namespace = ^(nwg-dock)$
    }
    blur = true
    ignore_alpha = 0.2
}

layerrule {
    name = glass-wofi
    match {
        namespace = ^(wofi)$
    }
    blur = true
    ignore_alpha = 0.3
}

layerrule {
    name = glass-vicinae
    match {
        namespace = ^(vicinae)$
    }
    blur = true
    ignore_alpha = 0.4
    animation = fade
}

layerrule {
    name = glass-drawer
    match {
        namespace = ^(nwg-drawer)$
    }
    blur = true
    ignore_alpha = 0.2
    animation = fade
}

layerrule {
    name = glass-notifications
    match {
        namespace = ^(notifications|swaync-notification-window|swaync-control-center)$
    }
    blur = true
    # 0.5 fica entre o fundo do cartao (0.55) e a sombra dele (0.42):
    # o vidro pega so o cartao e a sombra continua desenhada
    ignore_alpha = 0.5
    animation = slidefade 20%
}

animations {
    enabled = true

    # curvas com a "sensação" do macOS
    bezier = macEase,  0.22, 1.00, 0.36, 1.00
    bezier = macPop,   0.16, 1.10, 0.30, 1.00
    bezier = macSoft,  0.32, 0.72, 0.00, 1.00
    bezier = linear,   0, 0, 1, 1

    animation = global,     1, 7,    macEase
    animation = border,     1, 5,    macSoft
    animation = windows,    1, 4,    macPop,  popin 82%
    animation = windowsIn,  1, 4,    macPop,  popin 82%
    animation = windowsOut, 1, 3,    macEase, popin 88%
    animation = windowsMove,1, 4,    macSoft
    animation = fadeIn,     1, 2.5,  macEase
    animation = fadeOut,    1, 2,    macEase
    animation = fade,       1, 3,    macEase
    animation = layers,     1, 3,    macPop,  slide
    animation = layersIn,   1, 3,    macPop,  slide
    animation = layersOut,  1, 2.5,  macEase, slide
    animation = workspaces, 1, 4,    macSoft, slidefade 15%
    animation = specialWorkspace, 1, 4, macSoft, slidevert
}

dwindle {
    preserve_split = true
    smart_split = false
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    animate_manual_resizes = true
    background_color = rgba(1c1c1eff)
}

#############
### INPUT ###
#############

input {
    # ABNT2: layout "br" JÁ É o abnt2. Não use kb_variant aqui.
    kb_layout  = br
    kb_variant =
    kb_model   = abnt2
    kb_options = compose:caps
    kb_rules   =

    follow_mouse = 1
    sensitivity = 0
    numlock_by_default = true

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
    }
}

# Gestos do touchpad (3 dedos = trocar de espaço, como no macOS)
gesture = 3, horizontal, workspace
gesture = 4, horizontal, workspace

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER   # tecla "Cmd"

# ── Apps ──────────────────────────────────────
bind = $mainMod, SPACE,  exec, $vicinae         # Vicinae (Raycast-like)
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, T,      exec, $terminal
bind = $mainMod, E,      exec, $fileManager
bind = $mainMod, B,      exec, $browser
bind = $mainMod, R,      exec, $menu            # wofi (fallback)
bindr = $mainMod, SUPER_L, exec, $launchpad     # SUPER sozinho = Launchpad

# ── Janelas (estilo Cmd) ──────────────────────
bind = $mainMod, Q, killactive,                 # Cmd+Q
bind = $mainMod, W, killactive,                 # Cmd+W
bind = $mainMod, C, killactive,                 # (compatibilidade)

# Centro de Controle (Quickshell)
bind = $mainMod SHIFT, C, exec, qs -c controlcenter ipc call cc toggle
bind = $mainMod, H, exec, /home/sousa/.local/bin/win-minimize  # Cmd+H (esconder na gaveta)
bind = $mainMod, M, exec, /home/sousa/.local/bin/win-minimize   # Cmd+M = minimizar (macOS)
bind = $mainMod ALT, ESCAPE, forcekillactive                    # Cmd+Option+Esc = Force Quit
bind = $mainMod CTRL, SPACE, exec, vicinae cmd launch core:search-emojis  # Ctrl+Cmd+Espaço = emoji
bind = $mainMod SHIFT, H, workspace, 5                         # ver a gaveta

# clique na gaveta (ws 5) devolve a janela para a tela de origem
bindn = , mouse:272, exec, /home/sousa/.local/bin/win-restore
bind = $mainMod, F, fullscreen, 0
bind = $mainMod CTRL, F, fullscreen, 1
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit
bind = ALT, TAB, cyclenext,                     # alternar janela
bind = ALT, TAB, bringactivetotop,
bind = $mainMod, TAB, cyclenext,
bind = $mainMod, TAB, bringactivetotop,
bind = $mainMod, D, exec, /home/sousa/.local/bin/dock-toggle
bind = $mainMod, N, exec, swaync-client -t -sw   # central de notificações
bind = $mainMod CTRL, Q, exec, hyprlock         # Ctrl+Cmd+Q = bloquear
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, X, exec, /home/sousa/.local/bin/power-menu
bind = $mainMod SHIFT, M, exit,
bind = $mainMod SHIFT, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# ── Foco ──────────────────────────────────────
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# ── Mover janela ──────────────────────────────
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# ── Redimensionar ─────────────────────────────
binde = $mainMod CTRL, left,  resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive,  40 0
binde = $mainMod CTRL, up,    resizeactive,  0 -40
binde = $mainMod CTRL, down,  resizeactive,  0  40

# ── Espaços de trabalho ───────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4
bind = $mainMod CTRL, 5, movetoworkspace, 5
bind = $mainMod CTRL, 6, movetoworkspace, 6
bind = $mainMod CTRL, 7, movetoworkspace, 7
bind = $mainMod CTRL, 8, movetoworkspace, 8
bind = $mainMod CTRL, 9, movetoworkspace, 9
bind = $mainMod CTRL, 0, movetoworkspace, 10

# trocar de espaço como no macOS (Ctrl+setas)
bind = CTRL, right, workspace, e+1
bind = CTRL, left,  workspace, e-1

# levar a janela junto para o espaço vizinho
bind = CTRL SHIFT, right, movetoworkspace, e+1
bind = CTRL SHIFT, left,  movetoworkspace, e-1

# variante antiga (Ctrl+Cmd+setas) — mantida como alternativa
bind = $mainMod CTRL SHIFT, right, workspace, e+1
bind = $mainMod CTRL SHIFT, left,  workspace, e-1

# Scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll entre espaços
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Rato: arrastar / redimensionar
# OSD de volume: blur na layer, igual ao resto do sistema
layerrule {
    name = glass-swayosd
    match {
        namespace = ^(swayosd)$
    }
    blur = true
    ignore_alpha = 0.2
}

layerrule {
    name = glass-controlcenter
    match {
        namespace = ^(controlcenter)$
    }
    blur = true
    ignore_alpha = 0.3
    animation = fade
}

# geometria dos monitores mudou? invalida o cache de bordas (roda a cada reload)
exec = rm -f ~/.cache/hypr-edges

# soltar a janela na borda da tela move para o workspace vizinho
bindrn = , mouse:272, exec, /home/sousa/.local/bin/win-drag-edge
bindrn = $mainMod, mouse:272, exec, /home/sousa/.local/bin/win-drag-edge

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── Capturas de ecrã (estilo macOS) ───────────
# PrintScreen (Fn) = selecionar área, igual Cmd+Shift+4 do macOS
bind = , PRINT,       exec, /home/sousa/.local/bin/screenshot region
bind = SHIFT, PRINT,  exec, /home/sousa/.local/bin/screenshot full
bind = ALT, PRINT,    exec, /home/sousa/.local/bin/screenshot window

# equivalentes macOS
bind = $mainMod SHIFT, 3, exec, /home/sousa/.local/bin/screenshot full
bind = $mainMod SHIFT, 4, exec, /home/sousa/.local/bin/screenshot region
bind = $mainMod SHIFT, 5, exec, /home/sousa/.local/bin/screenshot window

# ── Gravação de ecrã ──────────────────────────
# mesmo atalho inicia e para a gravação (toggle)
bind = $mainMod SHIFT, 6, exec, /home/sousa/.local/bin/screenrecord region
bind = $mainMod SHIFT, 7, exec, /home/sousa/.local/bin/screenrecord full
bind = $mainMod SHIFT ALT, 6, exec, /home/sousa/.local/bin/screenrecord region --audio

# ── Multimédia ────────────────────────────────
bindel = ,XF86AudioRaiseVolume, exec, /home/sousa/.local/bin/vol-osd raise
bindel = ,XF86AudioLowerVolume, exec, /home/sousa/.local/bin/vol-osd lower
bindl  = ,XF86AudioMute,        exec, /home/sousa/.local/bin/vol-osd mute
bindl  = ,XF86AudioMicMute,     exec, /home/sousa/.local/bin/vol-osd mic-mute
bindel = ,XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext,  exec, swayosd-client --playerctl next
bindl = , XF86AudioPause, exec, swayosd-client --playerctl play-pause
bindl = , XF86AudioPlay,  exec, swayosd-client --playerctl play-pause
bindl = , XF86AudioPrev,  exec, swayosd-client --playerctl prev

##############################
### WINDOWS AND WORKSPACES ###
##############################

windowrule {
    name = suppress-maximize
    match {
        class = .*
    }
    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match {
        class = ^$
        title = ^$
        xwayland = true
        float = true
        fullscreen = false
        pin = false
    }
    no_focus = true
}

windowrule {
    name = float-dialogs
    match {
        class = ^(pavucontrol|org.pulseaudio.pavucontrol|blueman-manager|nm-connection-editor|qt6ct|nwg-look|org.kde.polkit-kde-authentication-agent-1)$
    }
    float = true
}

windowrule {
    name = translucent-terminal
    match {
        class = ^(com.mitchellh.ghostty|ghostty|kitty)$
    }
    opacity = 0.93 0.90
}

# Finder (Dolphin): vidro fosco como as janelas do macOS
windowrule {
    name = finder-glass
    match {
        class = ^(org\.kde\.dolphin)$
    }
    opacity = 0.96 0.92
}


# Diálogos do KDE (abrir/salvar arquivo, progresso) flutuam e ficam centrados
windowrule {
    name = kde-dialogs-float
    match {
        class = ^(org\.kde\.dolphin|org\.kde\.gwenview|org\.kde\.ark)$
        float = true
    }
    center = true
}

# trocar wallpaper aleatorio (~/Pictures/Wallpapers/anime)
bind = $mainMod SHIFT, W, exec, ~/.local/bin/wallpaper-random

#################
### HYPRBARS  ###
#################
# barra de título estilo macOS (botões fechar/minimizar/zoom)
source = ~/.config/hypr/hyprbars.conf
