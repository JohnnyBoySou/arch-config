# ─────────────────────────────────────────────
#  hyprlock — tela de bloqueio estilo macOS
# ─────────────────────────────────────────────

general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
    no_fade_out = false
}

# papel de parede desfocado, como no macOS
background {
    monitor =
    path = /home/sousa/.cache/wallpaper/current
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.65
    vibrancy = 0.17
    vibrancy_darkness = 0.05
}

# hora (grande, fina, no topo — como o macOS)
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.95)
    font_size = 110
    font_family = SF Pro Display Thin, Inter Thin, sans-serif
    position = 0, 260
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.45)
}

# data
label {
    monitor =
    text = cmd[update:43200000] LC_TIME=pt_BR.utf8 date +"%A, %d de %B"
    color = rgba(255, 255, 255, 0.85)
    font_size = 22
    font_family = SF Pro Text, Inter, sans-serif
    position = 0, 170
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
}

# avatar (círculo, como o macOS)
image {
    monitor =
    path = /home/sousa/.face
    size = 110
    rounding = -1
    border_size = 2
    border_color = rgba(255, 255, 255, 0.35)
    position = 0, -40
    halign = center
    valign = center
}

# nome do utilizador
label {
    monitor =
    text = $DESC
    color = rgba(255, 255, 255, 0.92)
    font_size = 19
    font_family = SF Pro Text, Inter, sans-serif
    position = 0, -130
    halign = center
    valign = center
}

# campo da senha — pílula translúcida
input-field {
    monitor =
    size = 300, 46
    outline_thickness = 1
    dots_size = 0.26
    dots_spacing = 0.32
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.28)
    inner_color = rgba(255, 255, 255, 0.15)
    font_color = rgba(255, 255, 255, 0.95)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffffaa">Digite a senha</span>
    check_color = rgba(10, 132, 255, 1.0)
    fail_color = rgba(255, 69, 58, 1.0)
    fail_text = <span foreground="##ffffff">Senha incorreta</span>
    rounding = 23
    position = 0, -190
    halign = center
    valign = center
}

# dica no rodapé
label {
    monitor =
    text = cmd[update:60000] echo "$(whoami)@$(hostname)"
    color = rgba(255, 255, 255, 0.45)
    font_size = 13
    font_family = SF Pro Text, Inter, sans-serif
    position = 0, 60
    halign = center
    valign = bottom
}
